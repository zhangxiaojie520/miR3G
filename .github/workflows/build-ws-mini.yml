name: Build easytier-mini + WebSocket (mipsel) [TEST]

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TARGET: mipsel-unknown-linux-musl
    steps:
      - name: Check out EasyTier source
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: main
          path: source
          persist-credentials: false

      - name: Patch easytier-mini Cargo.toml to add websocket feature
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = 'easytier-contrib/easytier-mini/Cargo.toml'
          s = open(p, encoding='utf-8').read()
          assert '"websocket"' not in s, 'websocket already present'
          old = '    "web-client",\n]'
          new = '    "web-client",\n    "websocket",\n]'
          assert old in s, 'anchor not found; Cargo.toml layout changed'
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched OK')
          PY
          echo '===== patched mini Cargo.toml ====='
          cat easytier-contrib/easytier-mini/Cargo.toml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qqy build-essential mold musl-tools

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rust-src

      - name: Set up MIPS (mipsel) cross toolchain
        working-directory: source
        run: |
          set -euo pipefail
          musl_target="mipsel-unknown-linux-muslsf"
          archive="${musl_target}.tar.xz"
          archive_sha=36d8b864b3f6d27558d3f19695a4a39b79a873086edc60bebf733777df2b8359
          mkdir -p musl_gcc
          wget --inet4-only -q \
            "https://github.com/cross-tools/musl-cross/releases/download/20250520/$archive" \
            -P musl_gcc/
          echo "$archive_sha  musl_gcc/$archive" | sha256sum --check --strict
          tar xf "musl_gcc/$archive" -C musl_gcc/
          chmod -R u+w "musl_gcc/$musl_target"
          echo "$PWD/musl_gcc/$musl_target/bin" >> "$GITHUB_PATH"
          ln -sfn "$PWD/musl_gcc/$musl_target/$musl_target/sysroot" musl_gcc/sysroot
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$PWD/musl_gcc/$musl_target/$musl_target/sysroot" >> "$GITHUB_ENV"
          gcc_dir="musl_gcc/$musl_target/lib/gcc/$musl_target/15.1.0"
          cp "$gcc_dir/libgcc_eh.a" "$gcc_dir/libunwind.a"
          (
            cd "$gcc_dir"
            ar x libgcc.a _ctzsi2.o _clz.o _bswapsi2.o
            ar rcs libctz.a _ctzsi2.o _clz.o _bswapsi2.o
          )

      - name: Build easytier-mini + websocket (mipsel)
        working-directory: source
        run: |
          set -euo pipefail
          ./easytier-contrib/easytier-mini/build-mips.sh mipsel

      - name: Inspect binary
        working-directory: source
        run: |
          set -euo pipefail
          BIN="target/$TARGET/mini/easytier-mini"
          test -f "$BIN"
          echo "===== size ====="
          wc -c "$BIN"
          du -h "$BIN"
          echo "===== protocol strings (should show websocket now) ====="
          strings "$BIN" | grep -iE 'websocket|ws://|wss://' | head -20 || echo 'NO websocket strings found'
          echo "===== file type ====="
          file "$BIN" || true

      - name: Package artifact
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p package
          cp "target/$TARGET/mini/easytier-mini" package/easytier-mini-ws-mipsel
          chmod +x package/easytier-mini-ws-mipsel
          gzip -9 -c package/easytier-mini-ws-mipsel > package/easytier-mini-ws-mipsel.gz
          sha256sum package/easytier-mini-ws-mipsel package/easytier-mini-ws-mipsel.gz
          ls -lh package/

      - name: Upload as release asset
        working-directory: source/package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ws-mini-test-$(date +%s)"
          gh release create "$TAG" \
            easytier-mini-ws-mipsel.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "easytier-mini + websocket mipsel (TEST $TAG)" \
            --notes "Test build: mini with websocket feature added via Cargo.toml patch. Download the .gz, gunzip to get easytier-mini-ws-mipsel." \
            --generate-notes 2>/dev/null || \
          gh release create "$TAG" \
            easytier-mini-ws-mipsel.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "easytier-mini + websocket mipsel (TEST $TAG)" \
            --notes "Test build: mini with websocket feature added via Cargo.toml patch."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Created release: $TAG"
