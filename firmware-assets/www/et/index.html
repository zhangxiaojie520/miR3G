<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mi4a · EasyTier 控制台</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#262d38;
    --fg:#e6edf3; --dim:#8b949e; --acc:#3fb950; --acc2:#58a6ff;
    --warn:#d29922; --bad:#f85149; --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  }
  html[data-theme="light"]{
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#dfe4ea;
    --fg:#1b222c; --dim:#6b7684; --acc:#1a7f37; --acc2:#0b62d6;
    --warn:#9a6700; --bad:#c62828;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
        font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill.on .dot{background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
  .pill.off .dot{background:var(--warn)}
  .pill.down .dot{background:var(--bad)}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;
         border:1px solid var(--line);background:var(--panel2);color:var(--fg);transition:.15s}
  button:hover{border-color:var(--acc2);color:var(--acc2)}
  button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed;filter:none}
  main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;padding:16px 20px 40px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;min-width:0}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
           margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .tag{text-transform:none;letter-spacing:0;font-weight:400;color:var(--dim);font-size:11.5px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--dim);white-space:nowrap}
  .kv dd{margin:0;font-family:var(--mono);word-break:break-all}
  .big{font-size:19px;font-weight:600;font-family:var(--mono)}
  .ok{color:var(--acc)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .node{display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
        font-family:var(--mono);font-size:13px}
  .node .st{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
  .st.y{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
  .st.n{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
  .st.w{color:var(--dim);background:color-mix(in srgb,var(--dim) 15%,transparent)}
  input[type=text],textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
        border-radius:8px;padding:9px 11px;font-family:var(--mono);font-size:12.5px;resize:vertical}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--acc2)}
  textarea{min-height:250px;line-height:1.5}
  pre{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
      padding:11px 12px;font-family:var(--mono);font-size:12px;line-height:1.5;
      max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--dim)}
  .routes{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
  .routes div{padding:6px 10px;background:var(--panel2);border-radius:6px;border:1px solid var(--line);word-break:break-all}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
  .bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
  .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
  #toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  #toast div{padding:10px 15px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
             box-shadow:0 8px 26px rgba(0,0,0,.28);font-size:13px;max-width:380px;animation:in .22s ease}
  #toast div.err{border-color:var(--bad)} #toast div.good{border-color:var(--acc)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .tiny{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tabs button{border:none;border-radius:0;background:transparent;padding:7px 14px;color:var(--dim);
               border-bottom:2px solid transparent}
  .tabs button.active{color:var(--acc2);border-bottom-color:var(--acc2);font-weight:600}
  .field{margin-bottom:11px}
  .field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
  .field .hint2{font-size:11px;color:var(--dim);margin-top:3px}
  .grid-f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px}
  .chk input{width:16px;height:16px}
  @media (max-width:560px){main{padding:12px;gap:12px} header{padding:12px 14px;flex-wrap:wrap}.grid-f{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>mi4a · EasyTier 控制台</h1>
  <span class="sub" id="hdr">—</span>
  <span class="spacer"></span>
  <span class="pill" id="pill"><span class="dot"></span><span id="pillText">检测中</span></span>
  <button id="btnRefresh">刷新</button>
  <button id="btnTheme" title="切换主题">◐</button>
</header>

<main>
  <section class="card">
    <h2>运行状态</h2>
    <dl class="kv">
      <dt>虚拟 IP</dt><dd id="fIp" class="big">—</dd>
      <dt>进程</dt><dd id="fPid">—</dd>
      <dt>运行时长</dt><dd id="fUp">—</dd>
      <dt>内存占用</dt><dd id="fRss">—</dd>
      <dt>二进制</dt><dd id="fBin">—</dd>
      <dt>tun 收发</dt><dd id="fIo">—</dd>
    </dl>
    <div class="hint">路由器可用内存 <b id="fAvail">—</b></div>
    <div class="bar"><i id="memBar" style="width:0%"></i></div>
  </section>

  <section class="card">
    <h2>操作</h2>
    <div class="grid2">
      <button id="btnStart" class="primary">启动</button>
      <button id="btnStop" class="danger">停止</button>
      <button id="btnRestart">重启</button>
      <button id="btnDeploy">恢复内置副本</button>
    </div>
    <div class="hint">所有操作在路由器本机执行。<b>重启后 /tmp 会清空</b>，若二进制丢失可在 overlay 放入 <span class="tiny">/www/et/et-z1.bin</span> 后点「恢复内置副本」。</div>
    <h2 style="margin-top:16px">隧道路由</h2>
    <div class="routes" id="routes"><div class="hint">—</div></div>
  </section>

  <section class="card">
    <h2>连通性 <span class="tag">每 8 秒自动测</span></h2>
    <div id="nodes" style="display:flex;flex-direction:column;gap:7px"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="customIps" placeholder="自定义目标，逗号分隔" style="flex:1;min-width:150px">
      <button id="btnPing">测试</button>
    </div>
  </section>

  <section class="card">
    <h2>参数配置 <span class="tag">保存并应用会做健康检查，失败自动回滚</span></h2>
    <div class="tabs">
      <button id="tabForm" class="active">表单</button>
      <button id="tabSrc">源码 TOML</button>
    </div>

    <div id="formView">
      <div class="grid-f">
        <div class="field"><label>实例名 instance_name</label><input type="text" id="cf_instance"></div>
        <div class="field"><label>主机名 hostname</label><input type="text" id="cf_hostname"></div>
        <div class="field"><label>虚拟 IP ipv4</label><input type="text" id="cf_ipv4" placeholder="10.126.126.6"></div>
        <div class="field"><label>监听 listeners</label><input type="text" id="cf_listeners" placeholder="tcp://0.0.0.0:11020, udp://0.0.0.0:11020"></div>
      </div>
      <div class="grid-f">
        <div class="field"><label>网络名 network_name</label><input type="text" id="cf_netname"></div>
        <div class="field"><label>密码 network_secret</label><input type="text" id="cf_secret"></div>
      </div>
      <div class="field"><label class="chk"><input type="checkbox" id="cf_enc"> 启用加密 enable_encryption <span class="tiny">（当前明文网络需取消勾选）</span></label></div>
      <div class="field"><label>代理网段 proxy_network（每行一个 CIDR）</label><textarea id="cf_proxy" style="min-height:56px"></textarea></div>
      <div class="field"><label>对端 peer（每行一个 URI）</label><textarea id="cf_peers" style="min-height:56px"></textarea></div>
    </div>

    <div id="srcView" style="display:none">
      <textarea id="cfg" spellcheck="false"></textarea>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="btnSave">保存</button>
      <button id="btnSaveRestart" class="primary">保存并应用</button>
      <button id="btnReload">重新读取</button>
      <button id="btnRollback" class="danger">回滚</button>
    </div>
    <div class="hint" id="cfgHint">当前配置：<span class="tiny">/tmp/et-z1.toml</span></div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>日志 <span class="tag">尾部 120 行</span>
      <span class="spacer" style="flex:1"></span>
      <label class="tiny" style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0">
        <input type="checkbox" id="autoLog" checked> 自动刷新
      </label>
    </h2>
    <pre id="log">—</pre>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_NODES = [
  ["10.126.126.1", "小米3G · 192.168.5.0/24"],
  ["10.126.126.2", "istoreos"],
  ["10.126.126.3", "红米手机"],
  ["192.168.5.1", "对端 LAN 网关"],
];
let statusTimer=null, pingTimer=null, logTimer=null, busy=false, pingBusy=false, curCfgText='';

function toast(msg, kind) {
  const d=document.createElement("div"); d.className=kind||"";
  d.textContent=msg; $("toast").appendChild(d); setTimeout(()=>d.remove(),4600);
}
async function api(path, opt) {
  const r=await fetch(path, opt);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
const fmtB = n => n>=1048576 ? (n/1048576).toFixed(2)+" MB" : Math.round(n/1024)+" KB";
function fmtDur(s){ if(!s) return "—"; const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`; }

function paint(d){
  const pill=$("pill"), txt=$("pillText");
  pill.className="pill "+(!d.reachable?"down":d.running?"on":"off");
  txt.textContent=!d.reachable?"路由器不可达":d.running?"运行中":"已停止";
  $("hdr").textContent=d.error?d.error:(d.tun_ip?"tun0 "+d.tun_ip:"无虚拟 IP");
  $("fIp").textContent=d.tun_ip||"—"; $("fIp").className="big "+(d.tun_ip?"ok":"bad");
  $("fPid").textContent=d.pid||"—";
  $("fUp").textContent=d.running?fmtDur(d.uptime):"—";
  $("fRss").textContent=d.rss_kb?d.rss_kb+" kB":"—";
  $("fBin").textContent=d.bin_size?fmtB(d.bin_size):"未部署";
  $("fIo").textContent=d.running?`RX ${d.tun_rx} / TX ${d.tun_tx}`:"—";
  const m=d.mem||{};
  $("fAvail").textContent=m.avail?(m.avail/1024).toFixed(1)+" MB / "+(m.total/1024).toFixed(0)+" MB":"—";
  const used=m.total?Math.round(m.used/m.total*100):0;
  const bar=$("memBar"); bar.style.width=used+"%";
  bar.className=used>80?"bad":used>60?"warn":"";
  const rs=(d.routes||"").split("\n").filter(Boolean);
  $("routes").innerHTML=rs.length?rs.map(r=>`<div>${r}</div>`).join(""):'<div class="hint">节点未启动或没有注入路由</div>';
  $("btnStart").disabled=busy||d.running;
  $("btnStop").disabled=busy||!d.running;
  $("btnRestart").disabled=busy||!d.running;
}
async function refresh(){
  try{ const d=await api("/cgi-bin/et?a=status"); paint(d); return d; }
  catch(e){ paint({reachable:false,error:String(e.message||e)}); }
}
async function runPing(list){
  if(pingBusy) return;
  const tg=list||DEFAULT_NODES.map(n=>n[0]);
  if(!tg.length) return;
  pingBusy=true;
  try{
    const d=await api("/cgi-bin/et?a=ping&targets="+tg.join(","));
    for(const r of d.results) setNode(r.ip,r.ok,r.ms);
  }catch(e){}finally{pingBusy=false;}
}
const nodesOn=new Set(DEFAULT_NODES.map(n=>n[0]));
function buildNodes(){
  $("nodes").innerHTML=DEFAULT_NODES.map(([ip,label])=>`
    <div class="node" data-ip="${ip}">
      <span>${ip} <span class="tiny">${label}</span></span>
      <span class="st w" data-st>等待</span>
    </div>`).join("");
}
function setNode(ip,ok,ms){
  const el=document.querySelector(`.node[data-ip="${ip}"] [data-st]`);
  if(!el) return;
  el.className="st "+(ok?"y":"n");
  el.textContent=ok?(ms?ms+" ms":"通"):"不通";
}

async function act(action,label){
  busy=true; ["btnStart","btnStop","btnRestart","btnDeploy"].forEach(i=>$(i).disabled=true);
  try{
    const d=await api("/cgi-bin/et?a=action",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action})
    });
    toast(d.message||label+"完成",d.ok?"good":"err");
    await new Promise(r=>setTimeout(r,1200));
  }catch(e){ toast(label+"失败："+e.message,"err"); }
  busy=false; await refresh(); runPing();
}
$("btnStart").onclick=()=>act("start","启动");
$("btnStop").onclick=()=>act("stop","停止");
$("btnRestart").onclick=()=>act("restart","重启");
$("btnDeploy").onclick=async()=>{
  busy=true; $("btnDeploy").disabled=true;
  try{
    const d=await api("/cgi-bin/et?a=deploy",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    toast(d.message,d.ok?"good":"err");
  }catch(e){ toast("恢复失败："+e.message,"err"); }
  busy=false; await refresh();
};

// ---- 配置：TOML <-> 表单 ----
function parseTOML(text){
  const c={instance_name:"",hostname:"",ipv4:"",listeners:[],network_name:"",network_secret:"",
           enable_encryption:false,proxies:[],peers:[]};
  let sec="";
  text.split("\n").forEach(line=>{
    const s=line.trim();
    if(s.startsWith("[")&&s.endsWith("]")){ sec=s; return; }
    let m;
    if(m=s.match(/^instance_name\s*=\s*"([^"]*)"/)) c.instance_name=m[1];
    else if(m=s.match(/^hostname\s*=\s*"([^"]*)"/)) c.hostname=m[1];
    else if(m=s.match(/^ipv4\s*=\s*"([^"]*)"/)) c.ipv4=m[1];
    else if(m=s.match(/^listeners\s*=\s*\[([^\]]*)\]/)) c.listeners=[...m[1].matchAll(/"([^"]*)"/g)].map(x=>x[1]);
    else if(sec==="[network_identity]"&&(m=s.match(/^network_name\s*=\s*"([^"]*)"/))) c.network_name=m[1];
    else if(sec==="[network_identity]"&&(m=s.match(/^network_secret\s*=\s*"([^"]*)"/))) c.network_secret=m[1];
    else if(sec==="[flags]"&&(m=s.match(/^enable_encryption\s*=\s*(true|false)/i))) c.enable_encryption=m[1].toLowerCase()==="true";
    else if(sec==="[[proxy_network]]"&&(m=s.match(/^cidr\s*=\s*"([^"]*)"/))) c.proxies.push(m[1]);
    else if(sec==="[[peer]]"&&(m=s.match(/^uri\s*=\s*"([^"]*)"/))) c.peers.push(m[1]);
  });
  return c;
}
function genTOML(c){
  const L=[];
  L.push(`instance_name = "${c.instance_name}"`);
  L.push(`hostname = "${c.hostname}"`);
  L.push(`ipv4 = "${c.ipv4}"`);
  L.push(`listeners = [${c.listeners.map(x=>`"${x}"`).join(", ")}]`);
  L.push("", "[network_identity]");
  L.push(`network_name = "${c.network_name}"`);
  L.push(`network_secret = "${c.network_secret}"`);
  L.push("", "[flags]");
  L.push(`enable_encryption = ${c.enable_encryption}`);
  L.push("");
  c.proxies.forEach(p=>{ L.push("[[proxy_network]]"); L.push(`cidr = "${p}"`); L.push(""); });
  c.peers.forEach(p=>{ L.push("[[peer]]"); L.push(`uri = "${p}"`); L.push(""); });
  return L.join("\n").trim()+"\n";
}
function formToCfg(){
  return {
    instance_name:$("cf_instance").value.trim(),
    hostname:$("cf_hostname").value.trim(),
    ipv4:$("cf_ipv4").value.trim(),
    listeners:$("cf_listeners").value.split(",").map(s=>s.trim()).filter(Boolean),
    network_name:$("cf_netname").value.trim(),
    network_secret:$("cf_secret").value.trim(),
    enable_encryption:$("cf_enc").checked,
    proxies:$("cf_proxy").value.split("\n").map(s=>s.trim()).filter(Boolean),
    peers:$("cf_peers").value.split("\n").map(s=>s.trim()).filter(Boolean),
  };
}
function fillForm(text){
  const c=parseTOML(text);
  $("cf_instance").value=c.instance_name;
  $("cf_hostname").value=c.hostname;
  $("cf_ipv4").value=c.ipv4;
  $("cf_listeners").value=c.listeners.join(", ");
  $("cf_netname").value=c.network_name;
  $("cf_secret").value=c.network_secret;
  $("cf_enc").checked=c.enable_encryption;
  $("cf_proxy").value=c.proxies.join("\n");
  $("cf_peers").value=c.peers.join("\n");
}
function currentCfgText(){
  return $("tabSrc").classList.contains("active") ? $("cfg").value : genTOML(formToCfg());
}
function switchTab(which){
  if(which==="src"){
    // 表单 -> 源码：先同步
    curCfgText=genTOML(formToCfg()); $("cfg").value=curCfgText;
    $("formView").style.display="none"; $("srcView").style.display="block";
    $("tabSrc").classList.add("active"); $("tabForm").classList.remove("active");
  }else{
    curCfgText=$("cfg").value; fillForm(curCfgText);
    $("srcView").style.display="none"; $("formView").style.display="block";
    $("tabForm").classList.add("active"); $("tabSrc").classList.remove("active");
  }
}
$("tabSrc").onclick=()=>switchTab("src");
$("tabForm").onclick=()=>switchTab("form");

async function loadCfg(){
  try{
    const d=await api("/cgi-bin/et?a=config");
    curCfgText=d.text||""; $("cfg").value=curCfgText; fillForm(curCfgText);
  }catch(e){ toast("读取配置失败："+e.message,"err"); }
}
$("btnReload").onclick=loadCfg;

async function saveCfg(restart){
  const text=currentCfgText();
  if(!text.trim()) return toast("配置为空","err");
  if(!restart){ // 仅保存：也需要让两端一致
    $("cfg").value=text;
    try{
      const d=await api("/cgi-bin/et?a=config_post",{method:"POST",headers:{"Content-Type":"text/plain"},body:text});
      toast(d.message,d.ok?"good":"err");
    }catch(e){ toast("保存失败："+e.message,"err"); }
    return;
  }
  // 保存并应用
  toast("正在应用配置并做健康检查（约 10 秒）…");
  try{
    const d=await api("/cgi-bin/et?a=config_post&restart=1",{method:"POST",headers:{"Content-Type":"text/plain"},body:text});
    toast(d.message,d.ok?"good":"err");
    if(d.restored_text){ $("cfg").value=d.restored_text; fillForm(d.restored_text); }
    await new Promise(r=>setTimeout(r,1000));
  }catch(e){ toast("应用失败："+e.message,"err"); }
  await refresh(); runPing();
}
$("btnSave").onclick=()=>saveCfg(false);
$("btnSaveRestart").onclick=()=>saveCfg(true);
$("btnRollback").onclick=()=>act("rollback","回滚");

$("btnPing").onclick=()=>{
  const raw=$("customIps").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!raw.length) return toast("先填目标 IP","err");
  raw.forEach(ip=>{
    if(!document.querySelector(`.node[data-ip="${ip}"]`)){
      const d=document.createElement("div"); d.className="node"; d.dataset.ip=ip;
      d.innerHTML=`<span>${ip} <span class="tiny">自定义</span></span><span class="st w" data-st>等待</span>`;
      $("nodes").appendChild(d);
    }
  });
  runPing(raw);
};

async function pullLog(){
  if(!$("autoLog").checked) return;
  try{
    const d=await api("/cgi-bin/et?a=log&lines=120");
    const pre=$("log");
    const atBottom=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-30;
    pre.textContent=d.text||"(暂无日志)";
    if(atBottom) pre.scrollTop=pre.scrollHeight;
  }catch(e){}
}
$("btnRefresh").onclick=async()=>{ await refresh(); runPing(); pullLog(); toast("已刷新"); };
$("btnTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",cur);
  localStorage.setItem("z1theme",cur);
};
(async function boot(){
  const t=localStorage.getItem("z1theme");
  if(t) document.documentElement.setAttribute("data-theme",t);
  buildNodes(); await refresh(); loadCfg(); runPing(); pullLog();
  statusTimer=setInterval(()=>refresh(),4000);
  pingTimer=setInterval(()=>runPing(),8000);
  logTimer=setInterval(pullLog,3000);
})();
</script>
</body>
</html>
